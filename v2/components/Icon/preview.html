<!-- @dsCard group="Brand" height=330 subtitle="36 duotone line icons" -->
<div class="xd" style="padding:24px;background:var(--ground);min-height:100%"><div id="g" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px"></div>
<script>
document.getElementById('g').innerHTML = XD.icons.map(function(n){return '<div style="display:grid;justify-items:center;gap:8px;font:12px var(--font-body);color:var(--ink-muted)"><span class="xd-iconbox"><xd-icon name="'+n+'"></xd-icon></span>'+n+'</div>'}).join('');
</script></div>
