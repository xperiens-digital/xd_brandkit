<!-- @dsCard group="Survey" height=120 subtitle="Segmented progress" -->
<div class="xd" style="padding:24px;background:var(--ground);min-height:100%"><div style="max-width:560px;display:grid;gap:18px"><xd-progress steps="6" current="2" label="AI readiness · Operations"></xd-progress>
<div style="display:flex;gap:10px"><button class="xd-btn xd-btn--secondary xd-btn--sm" onclick="var p=document.querySelector('xd-progress');p.setAttribute('current',Math.max(0,+p.getAttribute('current')-1))">Back</button><button class="xd-btn xd-btn--sm" onclick="var p=document.querySelector('xd-progress');p.setAttribute('current',Math.min(6,+p.getAttribute('current')+1))">Next</button></div></div></div>
