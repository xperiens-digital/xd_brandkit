<!-- @dsCard height=300 -->
<div style="position:relative;width:960px;height:300px;background:var(--ground);overflow:hidden;font-family:var(--font-display)">
<style>
.cv-night{fill:var(--night)} .cv-brand{fill:var(--brand)} .cv-apricot{fill:var(--transform-2)} .cv-sage{fill:var(--enable-1)} .cv-blush{fill:var(--discover-2)} .cv-lav{fill:var(--govern-1)} .cv-peri{fill:var(--transform-3)} .cv-peach{fill:var(--transform-1)} .cv-tint{fill:var(--govern-2)}
.cv-xl{rx:var(--radius-xl)} .cv-lg{rx:var(--radius-lg)} .cv-px{rx:4px}
</style>
<svg width="960" height="300" style="position:absolute;inset:0" aria-hidden="true">
<!-- blocks: night 216x280 slab (radius-xl), brand iris 168x120 (radius-lg), transform-2 apricot 120 disc (r 60), govern-2 lilac 168x108 (radius-lg)
     arrangement: one tall navy slab bleeding off the top with satellites stepping right, like the app box beside the mark
     pattern: the x.d pixel cells (the mark is built from pixels) in the V1 sweep hues on navy, 24px units on a 32px pitch
     scales: space-6 (24) units, space-8 (32) pitch, radius-lg 20, radius-xl 28, disc = half side -->
<rect class="cv-night cv-xl" x="520" y="-28" width="216" height="280"/>
<rect class="cv-brand cv-lg" x="752" y="24" width="168" height="120"/>
<rect class="cv-apricot" x="752" y="160" width="120" height="120" rx="60"/>
<rect class="cv-tint cv-lg" x="888" y="160" width="168" height="108"/>
<g>
<rect class="cv-lav cv-px" x="552" y="40" width="24" height="24"/><rect class="cv-lav cv-px" x="616" y="40" width="24" height="24"/>
<rect class="cv-blush cv-px" x="584" y="72" width="24" height="24"/>
<rect class="cv-blush cv-px" x="552" y="104" width="24" height="24"/><rect class="cv-peach cv-px" x="616" y="104" width="24" height="24"/>
<rect class="cv-peri cv-px" x="648" y="104" width="24" height="24"/>
<rect class="cv-sage cv-px" x="680" y="40" width="24" height="24"/><rect class="cv-sage cv-px" x="680" y="72" width="24" height="24"/><rect class="cv-sage cv-px" x="680" y="104" width="24" height="24"/>
<rect class="cv-peri cv-px" x="584" y="168" width="24" height="24"/><rect class="cv-brand cv-px" x="648" y="200" width="24" height="24"/>
</g>
</svg>
<div style="position:absolute;left:48px;bottom:44px;max-width:440px">
<div style="font-weight:400;font-size:76px;line-height:.95;letter-spacing:-.01em;color:var(--ink)">X.D Brand V2</div>
<div style="margin-top:14px;font:400 14px/1.4 var(--font-body);color:var(--ink-muted)">The V1 pastels and conic sweep, a strong iris accent, and logos built on the pixel module.</div>
</div>
</div>
