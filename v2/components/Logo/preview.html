<!-- @dsCard group="Brand" height=620 subtitle="Conic sweep turning; solid-to-sweep on hover for nav and footer" -->
<div class="xd" style="padding:24px;background:var(--ground);min-height:100%"><div style="display:grid;gap:16px">
 <div class="xd-eyebrow">Conic sweep, turning (spin)</div>
 <div style="display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding:28px;background:var(--surface);border-radius:var(--radius-lg)">
  <xd-mark size="64" spin></xd-mark><xd-mark size="64" lockup="stack" spin></xd-mark><xd-mark size="44" lockup="row" spin></xd-mark><xd-mark size="30" variant="box" spin></xd-mark>
 </div>
 <div class="xd-eyebrow">Conic sweep on navy, turning (spin)</div>
 <div style="display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding:28px;background:#18214D;border-radius:var(--radius-lg)">
  <xd-mark size="64" tone="dark" spin></xd-mark><xd-mark size="64" tone="dark" lockup="stack" spin></xd-mark><xd-mark size="44" tone="dark" lockup="row" spin></xd-mark>
 </div>
 <div class="xd-eyebrow">Nav and footer behaviour: solid at rest, point at it to fill with the turning sweep</div>
 <div style="display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding:28px;background:var(--surface);border-radius:var(--radius-lg)">
  <xd-mark size="44" lockup="row"></xd-mark><span style="flex:1"></span><span style="display:inline-flex;padding:20px 24px;background:#18214D;border-radius:var(--radius-md)"><xd-mark size="44" tone="dark" lockup="row"></xd-mark></span>
 </div>
</div></div>
