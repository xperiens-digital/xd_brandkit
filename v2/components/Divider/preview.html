<!-- @dsCard group="Brand" height=110 subtitle="Pixel divider and loader" -->
<div class="xd" style="padding:24px;background:var(--ground);min-height:100%"><div style="display:grid;gap:24px"><div class="xd-divider"><i style="--c:var(--transform-3)"></i><i style="--c:var(--govern-1)"></i><i style="--c:var(--discover-2)"></i><i style="--c:var(--transform-2)"></i><i style="--c:var(--enable-1)"></i></div>
<div class="xd-loader" aria-label="Loading"><i style="background:var(--transform-3)"></i><i style="animation-delay:.15s;background:var(--govern-1)"></i><i style="animation-delay:.3s;background:var(--discover-2)"></i><i style="animation-delay:.45s;background:var(--transform-2)"></i><i style="animation-delay:.6s;background:var(--enable-1)"></i><i style="animation-delay:.75s;background:var(--brand)"></i></div></div></div>
