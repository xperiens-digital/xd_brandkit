<!-- @dsCard group="Website" height=420 subtitle="Inputs, select, checks, toggle; fields stay aligned with hints and errors" -->
<div class="xd" style="padding:24px;background:var(--ground);min-height:100%"><form class="xd-form" style="max-width:640px" onsubmit="return false">
 <label class="xd-field"><span class="xd-label">Name</span><input class="xd-input" placeholder="Your name"></label>
 <label class="xd-field xd-field--error"><span class="xd-label">Work email</span><input class="xd-input" value="ben@" aria-invalid="true" aria-describedby="email-msg"><span class="xd-hint" id="email-msg">Enter a full email address</span></label>
 <label class="xd-field"><span class="xd-label">Business area you would like us to look at first</span><select class="xd-select"><option>Sales and bids</option><option>Operations</option><option>Finance</option></select></label>
 <label class="xd-field"><span class="xd-label">Company size</span><input class="xd-input" placeholder="Employees"><span class="xd-hint">Approximate is fine</span></label>
 <label class="xd-field xd-field--full"><span class="xd-label">What's slowing you down?</span><textarea class="xd-textarea" placeholder="A sentence or two is plenty"></textarea></label>
 <div class="xd-form__full" style="display:flex;gap:22px;align-items:center;flex-wrap:wrap"><label class="xd-check"><input type="checkbox" checked> Send me the engagement guide</label><label class="xd-check"><input type="radio" name="r" checked> Call</label><label class="xd-check"><input type="radio" name="r"> Email</label><label class="xd-check"><input type="checkbox" class="xd-toggle" role="switch" checked> Notify me</label></div>
</form></div>
